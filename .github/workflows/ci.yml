name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: local-placeholder-publishable-key
      SUPABASE_SECRET_KEY: local-placeholder-secret-key
      APP_SECRET: ci-only-app-secret-with-at-least-32-characters
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      CRON_SECRET: ci-only-cron-secret
      CLEANUP_SECRET: ci-only-cleanup-secret-with-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - run: npm run audit:prod
      - run: npm run build

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run db:start
      - run: npm run db:lint
      - run: npm run test:db
      - if: always()
        run: npm run db:stop -- --no-backup

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [application, database]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run db:start
      - name: Export local Supabase environment
        run: |
          npx supabase status -o env > supabase.env
          set -a
          source supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SECRET_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - run: npm run test:e2e
        env:
          E2E_FULL: "1"
          APP_SECRET: ci-only-app-secret-with-at-least-32-characters
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          CRON_SECRET: ci-only-cron-secret
          CLEANUP_SECRET: ci-only-cleanup-secret-with-at-least-32-characters
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
      - if: always()
        run: npm run db:stop -- --no-backup
