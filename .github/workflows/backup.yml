name: encrypted production backup

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

concurrency:
  group: production-backup
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      RCLONE_CONFIG_SUPABASE_TYPE: s3
      RCLONE_CONFIG_SUPABASE_PROVIDER: Other
      RCLONE_CONFIG_SUPABASE_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
      RCLONE_CONFIG_SUPABASE_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
      RCLONE_CONFIG_SUPABASE_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      RESTIC_PASSWORD: ${{ secrets.RESTIC_PASSWORD }}
      RESTIC_REPOSITORY: s3:${{ secrets.R2_ENDPOINT }}/${{ secrets.R2_BUCKET }}/baul-restic
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Install backup clients
        run: |
          sudo apt-get update
          sudo apt-get install --yes restic rclone
      - name: Export database and private storage
        shell: bash
        run: |
          set -euo pipefail
          export_dir="$RUNNER_TEMP/baul-backup"
          mkdir -p "$export_dir/database" "$export_dir/storage"
          npx supabase db dump --db-url "$SUPABASE_DB_URL" --file "$export_dir/database/roles.sql" --role-only
          npx supabase db dump --db-url "$SUPABASE_DB_URL" --file "$export_dir/database/schema.sql"
          npx supabase db dump --db-url "$SUPABASE_DB_URL" --file "$export_dir/database/data.sql" --use-copy --data-only -x "storage.buckets_vectors" -x "storage.vector_indexes"
          for bucket in avatars photos music stickers; do
            mkdir -p "$export_dir/storage/$bucket"
            rclone copy "SUPABASE:$bucket" "$export_dir/storage/$bucket" --checksum --checkers 4 --transfers 2
          done
          (
            cd "$export_dir"
            find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS
          )
      - name: Encrypt and retain backup in R2
        shell: bash
        run: |
          set -euo pipefail
          if ! restic snapshots >/dev/null 2>&1; then
            restic init
          fi
          restic backup "$RUNNER_TEMP/baul-backup" --tag production
          restic forget --tag production --keep-daily 7 --keep-weekly 4 --prune
          restic check --read-data-subset=5%
